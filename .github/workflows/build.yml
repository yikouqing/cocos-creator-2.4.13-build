name: Cocos Creator 2.4.13 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK/NDK components
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Install Cocos Creator 2.4.13
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cocos-creator"
          curl --fail --location --retry 3 \
            "https://download.cocos.com/CocosCreator/v2.4.13/CocosCreator-v2.4.13-20240123-mac.zip" \
            --output "$RUNNER_TEMP/cocos-creator-2.4.13.zip"
          unzip -q "$RUNNER_TEMP/cocos-creator-2.4.13.zip" -d "$RUNNER_TEMP/cocos-creator"
          APP="$(find "$RUNNER_TEMP/cocos-creator" -name 'CocosCreator.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo 'CocosCreator.app was not found in the official archive.' >&2
            find "$RUNNER_TEMP/cocos-creator" -maxdepth 3 -print | head -100
            exit 1
          fi
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_BIN=$APP/Contents/MacOS/CocosCreator" >> "$GITHUB_ENV"
          echo "Cocos Creator app: $APP"

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preconfigure Cocos Creator language
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.CocosCreator"
          printf '{"language":"zh"}\n' > "$HOME/.CocosCreator/settings.json"
          cat "$HOME/.CocosCreator/settings.json"

      - name: Prepare Rosetta for Intel Cocos Creator
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            if ! /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
              /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            fi
            /usr/bin/arch -x86_64 /usr/bin/true
          fi

      - name: Build Android debug APK
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ci-output/android"
          DIAG="$GITHUB_WORKSPACE/ci-output/diagnostics"
          LOG_FILE="$DIAG/creator-android.log"
          mkdir -p "$OUT" "$DIAG"
          BUILD_ARGS="platform=android;debug=false;buildPath=$OUT"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo 'Android SDK root is missing from the runner environment.' >&2
            exit 1
          fi
          NDK_ROOT="$SDK_ROOT/ndk/21.4.7075529"
          if [ ! -f "$NDK_ROOT/source.properties" ]; then
            echo "Expected NDK was not installed at $NDK_ROOT." >&2
            find "$SDK_ROOT/ndk" -maxdepth 2 -name source.properties -print 2>/dev/null || true
            exit 1
          fi
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export NDK_ROOT
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export NDK_HOME="$NDK_ROOT"
          echo "Android SDK Root: $ANDROID_SDK_ROOT"
          echo "Android NDK Root: $NDK_ROOT"
          echo "Starting Cocos Creator 2.4.13 Android build with --nologin and the Creator 2.4 --path option."
          if [ "$(uname -m)" = "arm64" ]; then
            CREATOR_COMMAND=(/usr/bin/arch -x86_64 "$CREATOR_BIN")
          else
            CREATOR_COMMAND=("$CREATOR_BIN")
          fi
          "${CREATOR_COMMAND[@]}" --nologin --path "$GITHUB_WORKSPACE" --build "$BUILD_ARGS" >"$LOG_FILE" 2>&1 &
          CREATOR_PID=$!
          trap 'kill -TERM "$CREATOR_PID" 2>/dev/null || true' EXIT
          NO_PROGRESS=0
          for i in $(seq 1 45); do
            sleep 60
            if ! kill -0 "$CREATOR_PID" 2>/dev/null; then
              break
            fi
            echo "=== Android build heartbeat $i $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
            PROCESS_LIST="$(ps -A -o pid=,ppid=,etime=,%cpu=,%mem=,stat=,command= | grep -E '[C]ocosCreator|[C]ocos Creator Helper|[G]radleDaemon' | head -20 || true)"
            printf '%s\n' "$PROCESS_LIST"
            CREATOR_CPU="$(printf '%s\n' "$PROCESS_LIST" | awk 'NF {sum += $4} END {printf "%.1f", sum}')"
            for p in "$GITHUB_WORKSPACE/library" "$GITHUB_WORKSPACE/temp" "$OUT"; do
              if [ -d "$p" ]; then du -sh "$p"; else echo "$p not created"; fi
            done
            tail -n 20 "$LOG_FILE" || true
            if [ "$i" = "3" ] || [ "$i" = "10" ] || [ "$i" = "25" ] || [ "$i" = "40" ]; then
              screencapture -x "$DIAG/creator-screen-$i.png" || true
            fi
            if [ ! -d "$GITHUB_WORKSPACE/library" ] && [ ! -d "$GITHUB_WORKSPACE/temp" ] && awk -v cpu="$CREATOR_CPU" 'BEGIN {exit !(cpu < 1.0)}'; then
              NO_PROGRESS=$((NO_PROGRESS + 1))
              echo "No asset database directories and Creator process tree CPU below 1% for $NO_PROGRESS consecutive minute(s)."
            else
              NO_PROGRESS=0
            fi
            if [ "$NO_PROGRESS" -ge 5 ]; then
              echo 'Creator appears blocked before asset database initialization; capturing the screen and stopping this run.' >&2
              screencapture -x "$DIAG/creator-screen-stalled.png" || true
              kill -TERM "$CREATOR_PID" 2>/dev/null || true
              sleep 5
              kill -KILL "$CREATOR_PID" 2>/dev/null || true
              wait "$CREATOR_PID" || true
              exit 124
            fi
          done
          if kill -0 "$CREATOR_PID" 2>/dev/null; then
            echo 'Creator remained active after 45 minutes; stopping this Android-only diagnostic build.' >&2
            kill -TERM "$CREATOR_PID" 2>/dev/null || true
            sleep 10
            kill -KILL "$CREATOR_PID" 2>/dev/null || true
            wait "$CREATOR_PID" || true
            exit 124
          fi
          wait "$CREATOR_PID"
          GRADLEW="$(find "$OUT" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo 'Creator did not generate a Gradle wrapper.' >&2
            find "$OUT" -maxdepth 5 -type f -print | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          (cd "$(dirname "$GRADLEW")" && ./gradlew assembleDebug --no-daemon)
          APK="$(find "$OUT" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo 'Gradle completed without producing an APK.' >&2
            exit 1
          fi
          echo "APK produced: $APK"
          ls -lh "$APK"

      - name: Upload Android APK or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-2.4.13-android-apk
          path: ci-output/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
