name: Cocos Creator 2.4.13 Build (Android / iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择打包平台'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Android SDK
        if: ${{ inputs.platform == 'android' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK/NDK components
        if: ${{ inputs.platform == 'android' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Set up Java for Android build
        if: ${{ inputs.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Cocos Creator 2.4.13
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cocos-creator"
          curl --fail --location --retry 3 \
            "https://download.cocos.com/CocosCreator/v2.4.13/CocosCreator-v2.4.13-20240123-mac.zip" \
            --output "$RUNNER_TEMP/cocos-creator-2.4.13.zip"
          unzip -q "$RUNNER_TEMP/cocos-creator-2.4.13.zip" -d "$RUNNER_TEMP/cocos-creator"
          APP="$(find "$RUNNER_TEMP/cocos-creator" -name 'CocosCreator.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo 'CocosCreator.app was not found in the official archive.' >&2
            exit 1
          fi
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_BIN=$APP/Contents/MacOS/CocosCreator" >> "$GITHUB_ENV"
          echo "Cocos Creator app: $APP"

      - name: Build ${{ inputs.platform }} package
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ inputs.platform }}"
          OUT="$GITHUB_WORKSPACE/ci-output/$PLATFORM"
          DIAG="$GITHUB_WORKSPACE/ci-output/diagnostics"
          LOG_FILE="$DIAG/creator-$PLATFORM.log"
          mkdir -p "$OUT" "$DIAG" "$HOME/.CocosCreator" "$HOME/.cocos"

          # 跳过 cocos.py 首次运行统计协议交互询问
          printf '{"agreement_shown":true,"enable_stat":false}\n' > "$HOME/.cocos/local_cfg.json"

          if [ "$PLATFORM" = "android" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            NDK_ROOT="$SDK_ROOT/ndk/21.4.7075529"
            if [ -z "$SDK_ROOT" ] || [ ! -f "$NDK_ROOT/source.properties" ]; then
              echo "Android SDK/NDK missing: SDK=$SDK_ROOT NDK=$NDK_ROOT" >&2
              exit 1
            fi
            export ANDROID_SDK_ROOT="$SDK_ROOT"
            export ANDROID_HOME="$SDK_ROOT"
            export NDK_ROOT
            export ANDROID_NDK_HOME="$NDK_ROOT"
            export NDK_HOME="$NDK_ROOT"
            printf '{"language":"zh","use-default-js-engine":true,"use-default-cpp-engine":true,"android-sdk-root":"%s","ndk-root":"%s"}\n' \
              "$SDK_ROOT" "$NDK_ROOT" > "$HOME/.CocosCreator/settings.json"
          else
            printf '{"language":"zh","use-default-js-engine":true,"use-default-cpp-engine":true}\n' \
              > "$HOME/.CocosCreator/settings.json"
          fi

          BUILD_ARGS="platform=$PLATFORM;debug=false;autoCompile=false;buildPath=$OUT"
          echo "Starting Cocos Creator 2.4.13 $PLATFORM build..."
          "$CREATOR_BIN" --nologin --path "$GITHUB_WORKSPACE" --build "$BUILD_ARGS" </dev/null >"$LOG_FILE" 2>&1 &
          CREATOR_PID=$!
          trap 'kill -TERM "$CREATOR_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            sleep 60
            if ! kill -0 "$CREATOR_PID" 2>/dev/null; then
              break
            fi
            echo "=== $PLATFORM build heartbeat $i $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
            ps -A -o pid=,ppid=,etime=,%cpu=,%mem=,stat=,command= | grep -E '[C]ocosCreator|[C]ocos Creator Helper' | head -10 || true
            for p in "$GITHUB_WORKSPACE/library" "$GITHUB_WORKSPACE/temp" "$OUT"; do
              if [ -d "$p" ]; then du -sh "$p"; else echo "$p not created"; fi
            done
            tail -n 15 "$LOG_FILE" || true
          done

          if kill -0 "$CREATOR_PID" 2>/dev/null; then
            echo "Creator remained active after 45 minutes; stopping." >&2
            kill -TERM "$CREATOR_PID" 2>/dev/null || true
            sleep 5
            kill -KILL "$CREATOR_PID" 2>/dev/null || true
            exit 124
          fi

          if ! wait "$CREATOR_PID"; then
            echo "=== Cocos Creator failed, last 50 lines of log ==="
            tail -n 50 "$LOG_FILE" || true
            exit 1
          fi

          if [ "$PLATFORM" = "android" ]; then
            GRADLEW="$(find "$OUT" -type f -name gradlew -print -quit)"
            if [ -z "$GRADLEW" ]; then
              echo 'Creator did not generate a Gradle wrapper.' >&2
              exit 1
            fi
            chmod +x "$GRADLEW"
            (cd "$(dirname "$GRADLEW")" && ./gradlew assembleDebug --no-daemon)
            APK="$(find "$OUT" -type f -name '*.apk' -print -quit)"
            if [ -z "$APK" ] || [ ! -s "$APK" ]; then
              echo 'Gradle completed without producing an APK.' >&2
              exit 1
            fi
            echo "APK produced: $APK"
            ls -lh "$APK"
          else
            XCODEPROJ="$(find "$OUT" -maxdepth 6 -name '*.xcodeproj' -type d -print -quit)"
            if [ -z "$XCODEPROJ" ]; then
              echo 'Creator did not generate an Xcode project.' >&2
              find "$OUT" -maxdepth 5 -print | head -100
              exit 1
            fi
            echo "Found Xcode project: $XCODEPROJ"
            SCHEME="$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | grep -i 'mobile' | head -n 1 | xargs || true)"
            if [ -z "$SCHEME" ]; then
              SCHEME="$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | xargs)"
            fi
            echo "Building iOS Scheme: $SCHEME"
            xcodebuild -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$OUT/DerivedData" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
            APP_PATH="$(find "$OUT/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -name '*.app' -type d -print -quit)"
            if [ -z "$APP_PATH" ]; then
              echo 'xcodebuild completed without producing a .app bundle.' >&2
              exit 1
            fi
            mkdir -p "$OUT/Payload"
            cp -R "$APP_PATH" "$OUT/Payload/"
            (cd "$OUT" && zip -qry "ios-unsigned.ipa" Payload)
            echo "Unsigned IPA produced: $OUT/ios-unsigned.ipa"
            ls -lh "$OUT/ios-unsigned.ipa"
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-2.4.13-${{ inputs.platform }}
          path: |
            ci-output/${{ inputs.platform }}/**/*.apk
            ci-output/${{ inputs.platform }}/ios-unsigned.ipa
            ci-output/diagnostics/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
