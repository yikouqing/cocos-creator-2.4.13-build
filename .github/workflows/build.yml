name: Cocos Creator 2.4.13 builds

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-all:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      DIAGNOSTIC_MODE: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Android SDK
        id: setup_android_sdk
        if: ${{ env.DIAGNOSTIC_MODE != 'true' }}
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK/NDK components
        if: ${{ env.DIAGNOSTIC_MODE != 'true' && steps.setup_android_sdk.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Install Cocos Creator 2.4.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cocos-creator"
          curl --fail --location --retry 3 \
            "https://download.cocos.com/CocosCreator/v2.4.13/CocosCreator-v2.4.13-20240123-mac.zip" \
            --output "$RUNNER_TEMP/cocos-creator-2.4.13.zip"
          unzip -q "$RUNNER_TEMP/cocos-creator-2.4.13.zip" -d "$RUNNER_TEMP/cocos-creator"
          APP="$(find "$RUNNER_TEMP/cocos-creator" -name 'CocosCreator.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo 'CocosCreator.app was not found in the official archive.' >&2
            find "$RUNNER_TEMP/cocos-creator" -maxdepth 3 -print | head -100
            exit 1
          fi
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_BIN=$APP/Contents/MacOS/CocosCreator" >> "$GITHUB_ENV"
          echo "Cocos Creator app: $APP"

      - name: Build Web Mobile or diagnose Creator startup
        id: web
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output/web" "$GITHUB_WORKSPACE/ci-output/diagnostics"
          BUILD_ARGS="platform=web-mobile;debug=false;buildPath=$GITHUB_WORKSPACE/ci-output/web"
          if [ "$DIAGNOSTIC_MODE" = "true" ]; then
            LOG_FILE="$GITHUB_WORKSPACE/ci-output/diagnostics/creator-cli.log"
            echo "DIAGNOSTIC_MODE=true: launch Cocos Creator for up to six minutes with process and screen heartbeats."
            "$CREATOR_BIN" -- --nologin --project "$GITHUB_WORKSPACE" --build "$BUILD_ARGS" >"$LOG_FILE" 2>&1 &
            CREATOR_PID=$!
            for i in $(seq 1 12); do
              sleep 30
              if ! kill -0 "$CREATOR_PID" 2>/dev/null; then
                break
              fi
              echo "=== heartbeat $i $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
              ps -A -o pid=,ppid=,etime=,%cpu=,%mem=,stat=,command= | grep -E '[C]ocosCreator|[C]ocos Creator|[C]ocosCreator Helper|[C]ocos Creator Helper' | head -20 || true
              for p in "$GITHUB_WORKSPACE/library" "$GITHUB_WORKSPACE/temp" "$GITHUB_WORKSPACE/ci-output/web"; do
                if [ -d "$p" ]; then du -sh "$p"; else echo "$p not created"; fi
              done
              tail -n 15 "$LOG_FILE" || true
              if [ "$i" = "2" ] || [ "$i" = "6" ] || [ "$i" = "10" ]; then
                screencapture -x "$GITHUB_WORKSPACE/ci-output/diagnostics/creator-screen-$i.png" || true
              fi
            done
            if kill -0 "$CREATOR_PID" 2>/dev/null; then
              echo 'Creator remained active after six minutes; stopping this diagnostic-only process.'
              kill -TERM "$CREATOR_PID" 2>/dev/null || true
              sleep 5
              kill -KILL "$CREATOR_PID" 2>/dev/null || true
              wait "$CREATOR_PID" || true
              exit 124
            fi
            wait "$CREATOR_PID"
          else
            "$CREATOR_BIN" --project "$GITHUB_WORKSPACE" --build "$BUILD_ARGS"
          fi

      - name: Set up Java for Android build
        if: ${{ env.DIAGNOSTIC_MODE != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Android project and debug APK
        id: android
        if: ${{ env.DIAGNOSTIC_MODE != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output/android"
          "$CREATOR_BIN" --project "$GITHUB_WORKSPACE" \
            --build "platform=android;debug=false;buildPath=$GITHUB_WORKSPACE/ci-output/android"
          GRADLEW="$(find "$GITHUB_WORKSPACE/ci-output/android" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo 'Creator did not generate a Gradle wrapper; keeping the generated Android project as an artifact.'
            exit 0
          fi
          chmod +x "$GRADLEW"
          (cd "$(dirname "$GRADLEW")" && ./gradlew assembleDebug --no-daemon)

      - name: Build iOS project and unsigned simulator app
        id: ios
        if: ${{ env.DIAGNOSTIC_MODE != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output/ios"
          "$CREATOR_BIN" --project "$GITHUB_WORKSPACE" \
            --build "platform=ios;debug=false;buildPath=$GITHUB_WORKSPACE/ci-output/ios"
          XCODEPROJ="$(find "$GITHUB_WORKSPACE/ci-output/ios" -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$XCODEPROJ" ]; then
            echo 'Creator did not generate an Xcode project.' >&2
            exit 1
          fi
          SCHEME="$(xcodebuild -list -json -project "$XCODEPROJ" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=next(iter(d.get("project",{}).get("schemes",[])), ""); print(p)')"
          if [ -z "$SCHEME" ]; then
            echo 'No shared Xcode scheme found; keeping the generated Xcode project as an artifact.'
            exit 0
          fi
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/cocos-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload build outputs and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-2.4.13-builds
          path: ci-output/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
