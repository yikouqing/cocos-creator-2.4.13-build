name: Cocos Creator 2.4.13 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: macos-15-intel
    timeout-minutes: 110
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK/NDK components
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Install Cocos Creator 2.4.13
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cocos-creator"
          curl --fail --location --retry 3 \
            "https://download.cocos.com/CocosCreator/v2.4.13/CocosCreator-v2.4.13-20240123-mac.zip" \
            --output "$RUNNER_TEMP/cocos-creator-2.4.13.zip"
          unzip -q "$RUNNER_TEMP/cocos-creator-2.4.13.zip" -d "$RUNNER_TEMP/cocos-creator"
          APP="$(find "$RUNNER_TEMP/cocos-creator" -name 'CocosCreator.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo 'CocosCreator.app was not found in the official archive.' >&2
            find "$RUNNER_TEMP/cocos-creator" -maxdepth 3 -print | head -100
            exit 1
          fi
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_BIN=$APP/Contents/MacOS/CocosCreator" >> "$GITHUB_ENV"
          echo "Cocos Creator app: $APP"

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Android debug APK
        timeout-minutes: 62
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ci-output/android"
          DIAG="$GITHUB_WORKSPACE/ci-output/diagnostics"
          LOG_FILE="$DIAG/creator-android.log"
          mkdir -p "$OUT" "$DIAG"
          BUILD_ARGS="platform=android;debug=false;buildPath=$OUT"
          echo "Starting Cocos Creator 2.4.13 Android build with --nologin."
          "$CREATOR_BIN" -- --nologin --project "$GITHUB_WORKSPACE" --build "$BUILD_ARGS" >"$LOG_FILE" 2>&1 &
          CREATOR_PID=$!
          trap 'kill -TERM "$CREATOR_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 29); do
            sleep 120
            if ! kill -0 "$CREATOR_PID" 2>/dev/null; then
              break
            fi
            echo "=== Android build heartbeat $i $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
            ps -A -o pid=,ppid=,etime=,%cpu=,%mem=,stat=,command= | grep -E '[C]ocosCreator|[C]ocos Creator|[G]radleDaemon' | head -20 || true
            for p in "$GITHUB_WORKSPACE/library" "$GITHUB_WORKSPACE/temp" "$OUT"; do
              if [ -d "$p" ]; then du -sh "$p"; else echo "$p not created"; fi
            done
            tail -n 20 "$LOG_FILE" || true
            if [ "$i" = "5" ] || [ "$i" = "15" ] || [ "$i" = "25" ]; then
              screencapture -x "$DIAG/creator-screen-$i.png" || true
            fi
          done
          if kill -0 "$CREATOR_PID" 2>/dev/null; then
            echo 'Creator remained active after 58 minutes; stopping this Android-only diagnostic build.' >&2
            kill -TERM "$CREATOR_PID" 2>/dev/null || true
            sleep 10
            kill -KILL "$CREATOR_PID" 2>/dev/null || true
            wait "$CREATOR_PID" || true
            exit 124
          fi
          wait "$CREATOR_PID"
          GRADLEW="$(find "$OUT" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo 'Creator did not generate a Gradle wrapper.' >&2
            find "$OUT" -maxdepth 5 -type f -print | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          (cd "$(dirname "$GRADLEW")" && ./gradlew assembleDebug --no-daemon)
          APK="$(find "$OUT" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo 'Gradle completed without producing an APK.' >&2
            exit 1
          fi
          echo "APK produced: $APK"
          ls -lh "$APK"

      - name: Upload Android APK or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-2.4.13-android-apk
          path: ci-output/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
